<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  role="img"
  aria-label="FinControl"
>
  <defs>
    <linearGradient
      id="background"
      x1="8"
      y1="6"
      x2="56"
      y2="60"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#ff3b4d" />
      <stop offset="0.52" stop-color="#e50920" />
      <stop offset="1" stop-color="#8f0013" />
    </linearGradient>

    <linearGradient
      id="bars"
      x1="0"
      y1="12"
      x2="0"
      y2="52"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.42" stop-color="#ffd8dc" />
      <stop offset="1" stop-color="#ff5f6d" />
    </linearGradient>

    <radialGradient
      id="shine"
      cx="0"
      cy="0"
      r="1"
      gradientTransform="translate(18 12) rotate(45) scale(42)"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <filter
      id="shadow"
      x="-40%"
      y="-40%"
      width="180%"
      height="180%"
      color-interpolation-filters="sRGB"
    >
      <feDropShadow
        dx="0"
        dy="3"
        stdDeviation="3"
        flood-color="#2b0007"
        flood-opacity="0.45"
      />
    </filter>

    <filter
      id="barGlow"
      x="-100%"
      y="-60%"
      width="300%"
      height="220%"
      color-interpolation-filters="sRGB"
    >
      <feDropShadow
        dx="0"
        dy="2"
        stdDeviation="2"
        flood-color="#ff4b5f"
        flood-opacity="0.35"
      />
    </filter>
  </defs>

  <rect
    x="3"
    y="3"
    width="58"
    height="58"
    rx="16"
    fill="#080808"
  />

  <rect
    x="5"
    y="5"
    width="54"
    height="54"
    rx="14"
    fill="url(#background)"
    filter="url(#shadow)"
  />

  <rect
    x="5"
    y="5"
    width="54"
    height="54"
    rx="14"
    fill="url(#shine)"
  />

  <path
    d="M8 18C14 9 24 6 36 7"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.12"
    stroke-width="2"
    stroke-linecap="round"
  />

  <g filter="url(#barGlow)">
    <rect
      x="14"
      y="36"
      width="7"
      height="14"
      rx="3.5"
      fill="url(#bars)"
    />

    <rect
      x="25"
      y="29"
      width="7"
      height="21"
      rx="3.5"
      fill="url(#bars)"
    />

    <rect
      x="36"
      y="21"
      width="7"
      height="29"
      rx="3.5"
      fill="url(#bars)"
    />

    <rect
      x="47"
      y="13"
      width="7"
      height="37"
      rx="3.5"
      fill="url(#bars)"
    />
  </g>

  <path
    d="M14 51H54"
    stroke="#67000c"
    stroke-opacity="0.35"
    stroke-width="1.5"
    stroke-linecap="round"
  />
</svg>